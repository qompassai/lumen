[workspace]
members = ["crates/lumen-canon"]
resolver = "2"

[package]
name = "lumen-mcp-server"
version = "1.0.0"
edition = "2024"
license = "Apache-2.0"
description = "Lux in motu - cross-platform, cross-media deterministic conversion engine: 2D art, 3D models and engine formats from code-first records"

# The library keeps its pre-rename crate name: the workspace's
# tests and the A2A surface link `lumen::` (D-298 renamed the
# server package, not the library API).
[lib]
name = "lumen"
path = "src/lib.rs"

[dependencies]
# rmcp is pinned to the fleet version (D-113 standardization): one
# SDK version across every estate server; bumps are single fleet
# events. As of 0.2.0 the server speaks the modern protocol era
# only (2026-07-28); see src/guard.rs.
rmcp = { version = "=3.8.0", features = ["server", "macros", "schemars", "transport-io"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "time", "fs", "io-util", "sync", "net"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
image = { version = "0.25", default-features = false, features = ["png", "gif"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls"] }
base64 = "0.22"
# Canon machinery (B2, D-292/D-312): canon-record/1 format, handle
# protocol, proportion + register band gate (crates/lumen-canon).
canon-record = { package = "lumen-canon", version = "1.0.0", path = "crates/lumen-canon" }
# The generation lane folded from atelier (D-143): sha2 pins model
# admission hashes; png reads generated-image dimensions directly.
sha2 = "0.10"
png = "0.17"
mlua = { version = "0.11", features = ["vendored", "lua54"] }
asefile = "0.3"
rectangle-pack = "0.4"
imageproc = "0.25"
clap = { version = "4", features = ["derive"] }
rayon = "1"
notify = "8"
indicatif = "0.18"
# ONNX Runtime for Real-ESRGAN inference. CUDA EP for primo's RTX 4070.
ort = { version = "2.0.0-rc.10", features = ["download-binaries"] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
toml = { version = "=0.8.23", default-features = false, features = ["parse"] }

[profile.release]
overflow-checks = true

[lints.rust]
unsafe_code = "forbid"
[dev-dependencies]
tempfile = "3"
