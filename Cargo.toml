[package]
name = "lumen"
version = "0.1.0"
edition = "2024"
description = "Lux in motu - MCP server for Aseprite sprite artistry with Bevy live-world interop"

[dependencies]
rmcp = { version = "3.3", features = ["server", "macros", "schemars", "transport-io"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "time", "fs", "io-util", "sync", "net"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
image = { version = "0.25", default-features = false, features = ["png", "gif"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
base64 = "0.22"
mlua = { version = "0.11", features = ["vendored", "lua54"] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
toml = { version = "=0.8.23", default-features = false, features = ["parse"] }

[profile.release]
overflow-checks = true

[lints.rust]
unsafe_code = "forbid"
[dev-dependencies]
tempfile = "3"
