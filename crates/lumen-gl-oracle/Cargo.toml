[package]
name = "lumen-gl-oracle"
version = "0.1.0"
edition = "2024"
description = "D-870 GL same-route oracle: inox2d and lumen puppet evaluations through one unmodified inox2d-opengl rasterizer. Verification instrument only; never a shipping gate."
license = "Apache-2.0"
publish = false

# Standalone workspace: never a member of the root, lumen-factory or
# lumen-rig-core workspaces, so the default gates of all three never
# load the path dependencies below (they point at the coordinator's
# staged, read-only vendored inox2d outside the repository).
[workspace]

[dependencies]
# The reference evaluator + reference GL rasterizer, byte-unmodified
# (branch 1; hash manifest before/after in the oracle evidence).
inox2d = { path = "../../../ref/inox2d/inox2d" }
inox2d-opengl = { path = "../../../ref/inox2d/inox2d-opengl" }
# The evaluator under measurement, with its read-only oracle accessor.
lumen-rig-core = { path = "../lumen-rig-core", features = ["oracle"] }

# Window/GL stack pinned to the spike driver's (ref/driver-fixed):
# identical GL config selection for both arms.
glam = { version = "0.29.0", features = ["bytemuck"] }
glow = "0.14.1"
glutin = "0.31.2"
glutin-winit = "0.4.2"
image = { version = "0.25.2", default-features = false, features = ["jpeg", "png", "tga"] }
raw-window-handle = "0.5.2"
tracing = "0.1.37"
winit = { version = "0.29", features = ["rwh_05"] }
