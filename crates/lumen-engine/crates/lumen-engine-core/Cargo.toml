[package]
name = "lumen-engine-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Deterministic runtime core for the lumen engine experiment (D-895): fixed-step clock, scene/state records, two-body contact seam, dialogue runtime, effect player, audio binding evaluation. No rendering, no I/O beyond record parsing."

[dependencies]
lumen-rig-core = { path = "../../../lumen-rig-core" }
ron = "0.8"
serde = { version = "1.0", features = ["derive"] }
