[package]
name = "lumen-scene-script"
version = "0.1.0"
edition = "2024"
description = "Shared, versioned scene values: integral-frame time, piecewise-linear curves, provenance labels. No model, filesystem, renderer or style authority."
license = "Apache-2.0"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[lints.rust]
unsafe_code = "forbid"
