[package]
name = "lumen-rig-core"
version = "0.2.0"
edition = "2024"
description = "Validating parser and deterministic motion evaluator for the lumen rig format (model and motion assets, format v1)."
license = "Apache-2.0"

[workspace]

[dependencies]
# serde: the data model. The raw layer derives Deserialize (strict,
# unknown fields denied); the validated layer derives Serialize for
# canonical emission (SPEC.md sections 1.1 and 1.2).
serde = { version = "1.0", features = ["derive"] }
# serde_json: the format's JSON parser and emitter. Its
# shortest-round-trip float formatting is part of the format's
# canonical form (SPEC.md section 1.2), not an implementation detail.
serde_json = "1.0"
# image + png: RENDER-1's texture decode and frame encode.
# PNG only — the format's textures are PNG files, and the
# encoder is driven with fixed settings so a frame's bytes
# are a pure function of its pixels.
image = { version = "0.25", default-features = false, features = ["png"] }
png = "0.17"
